<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ code }} · Odoo Tickets</title>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body class="centred">
<main class="card error-card">
  <p class="error-code">{{ code }}</p>
  <h1 class="error-message">{{ message }}</h1>
  <p class="error-actions">
    <a class="button" href="/">Back to the inbox</a>
  </p>
</main>
</body>
</html>
